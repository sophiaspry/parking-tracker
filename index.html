<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #619EC9, #4a7ba7);
            transition: background 0.5s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .status {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
            font-weight: 500;
        }

        .roommate-section {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .roommate-section:hover {
            background: #e9ecef;
        }

        .roommate-label {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .slider-container {
            position: relative;
            display: inline-block;
        }

        .slider {
            width: 80px;
            height: 40px;
            background: #ddd;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s ease;
            border: 2px solid #ccc;
        }

        .slider.active {
            background: linear-gradient(45deg, #28a745, #20c997);
            border-color: #28a745;
        }

        .slider.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .slider-icon {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .slider.active .slider-icon {
            transform: translateX(40px);
        }

        .parking-info {
            background: rgba(0, 0, 0, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .spots-used {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        /* Background color classes */
        .bg-empty {
            background: linear-gradient(135deg, #619EC9, #4a7ba7);
        }

        .bg-one {
            background: linear-gradient(135deg, #8D7CC4, #7565b8);
        }

        .bg-full {
            background: linear-gradient(135deg, #B03737, #942d2d);
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .roommate-section {
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body class="bg-empty">
    <div class="container">
        <h1>Parking Tracker</h1>
        <div class="status" id="status">0 of 2 spots occupied</div>
        
        <div class="roommate-section">
            <div class="roommate-label">Roommate 1</div>
            <div class="slider-container">
                <div class="slider" id="slider1" onclick="toggleSlider(1)">
                    <div class="slider-icon">💜</div>
                </div>
            </div>
        </div>
        
        <div class="roommate-section">
            <div class="roommate-label">Roommate 2</div>
            <div class="slider-container">
                <div class="slider" id="slider2" onclick="toggleSlider(2)">
                    <div class="slider-icon">💎</div>
                </div>
            </div>
        </div>
        
        <div class="roommate-section">
            <div class="roommate-label">Roommate 3</div>
            <div class="slider-container">
                <div class="slider" id="slider3" onclick="toggleSlider(3)">
                    <div class="slider-icon">⭐</div>
                </div>
            </div>
        </div>
        
        <div class="parking-info">
            <div class="spots-used" id="spotsUsed">Available Spots: 2</div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getDatabase, ref, set, onValue, off } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCgVBxDztMmm2m33ixI27_k6GkMiA8SZ38",
            authDomain: "parking-tracker-f2474.firebaseapp.com",
            databaseURL: "https://parking-tracker-f2474-default-rtdb.firebaseio.com",
            projectId: "parking-tracker-f2474",
            storageBucket: "parking-tracker-f2474.firebasestorage.app",
            messagingSenderId: "183419808732",
            appId: "1:183419808732:web:68fc57d526396dd1f87d19"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const parkingRef = ref(database, 'parking');

        // State management
        let roommates = {
            1: false,
            2: false,
            3: false
        };

        let isUpdatingFromFirebase = false;

        // Save data to Firebase
        function saveToFirebase() {
            if (!isUpdatingFromFirebase) {
                set(parkingRef, roommates)
                    .then(() => {
                        console.log('Data saved successfully');
                    })
                    .catch((error) => {
                        console.error('Error saving data:', error);
                    });
            }
        }

        // Load data from Firebase and listen for changes
        function setupFirebaseListener() {
            onValue(parkingRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    isUpdatingFromFirebase = true;
                    roommates = { ...data };
                    updateUI();
                    isUpdatingFromFirebase = false;
                    console.log('Data loaded from Firebase:', roommates);
                } else {
                    // Initialize with default data if nothing exists
                    saveToFirebase();
                }
            }, (error) => {
                console.error('Error loading data:', error);
                // Continue with local functionality if Firebase fails
                updateUI();
            });
        }

        function updateUI() {
            const occupiedCount = Object.values(roommates).filter(Boolean).length;
            const body = document.body;
            const status = document.getElementById('status');
            const spotsUsed = document.getElementById('spotsUsed');
            
            // Update status text
            status.textContent = `${occupiedCount} of 2 spots occupied`;
            spotsUsed.textContent = `Available Spots: ${2 - occupiedCount}`;
            
            // Update background color
            body.className = '';
            if (occupiedCount === 0) {
                body.classList.add('bg-empty');
            } else if (occupiedCount === 1) {
                body.classList.add('bg-one');
            } else {
                body.classList.add('bg-full');
            }
            
            // Update slider states and disable/enable as needed
            for (let i = 1; i <= 3; i++) {
                const slider = document.getElementById(`slider${i}`);
                const isActive = roommates[i];
                
                if (isActive) {
                    slider.classList.add('active');
                    slider.classList.remove('disabled');
                } else {
                    slider.classList.remove('active');
                    
                    // Disable if 2 spots are already occupied
                    if (occupiedCount >= 2) {
                        slider.classList.add('disabled');
                    } else {
                        slider.classList.remove('disabled');
                    }
                }
            }
        }

        function toggleSlider(roommateId) {
            const slider = document.getElementById(`slider${roommateId}`);
            const occupiedCount = Object.values(roommates).filter(Boolean).length;
            
            // Don't allow toggle if slider is disabled
            if (slider.classList.contains('disabled')) {
                return;
            }
            
            // If trying to turn on and already 2 spots occupied, don't allow
            if (!roommates[roommateId] && occupiedCount >= 2) {
                return;
            }
            
            // Toggle the state
            roommates[roommateId] = !roommates[roommateId];
            
            // Update the UI immediately
            updateUI();
            
            // Save to Firebase
            saveToFirebase();
            
            // Add a little animation feedback
            slider.style.transform = 'scale(0.95)';
            setTimeout(() => {
                slider.style.transform = 'scale(1)';
            }, 150);
        }

        // Make toggleSlider available globally
        window.toggleSlider = toggleSlider;

        // Initialize Firebase listener when page loads
        document.addEventListener('DOMContentLoaded', () => {
            setupFirebaseListener();
        });

        // Initialize the UI
        updateUI();
    </script>
</body>
</html>
